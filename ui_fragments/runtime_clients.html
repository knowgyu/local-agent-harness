{{define "lah-ui-fragment-runtime-clients"}}
<style>
  #runtime-clients .client-status-list { display: grid; grid-template-columns: minmax(88px, .7fr) minmax(0, 1.3fr); gap: 4px 12px; margin: 12px 0; }
  #runtime-clients .client-status-list dt { color: var(--muted); font-weight: 650; }
  #runtime-clients .client-status-list dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
  #runtime-clients h3:focus, #runtime-clients-review-heading:focus { outline: 3px solid var(--focus); outline-offset: 3px; }
</style>
<section id="runtime-clients" class="panel" style="margin-top:16px" aria-labelledby="runtime-clients-heading" data-csrf="{{.CSRF}}">
  <h2 id="runtime-clients-heading" data-message-en="AI client setup and status" data-message-ko="AI 클라이언트 설정 및 상태">{{if eq .Language "ko"}}AI 클라이언트 설정 및 상태{{else}}AI client setup and status{{end}}</h2>
  <p class="hint" data-runtime-clients-copy="intro"></p>
  <p id="runtime-clients-runtime" class="status" role="status" aria-live="polite" data-runtime-clients-copy="runtimeLoading"></p>
  <p id="runtime-clients-runtime-observed" class="hint" role="status" aria-live="polite"></p>
  <button id="runtime-clients-refresh" class="secondary" type="button" data-runtime-clients-copy="refresh"></button>
  <p id="runtime-clients-action-status" class="status" role="status" aria-live="polite" tabindex="-1" hidden></p>
  <div id="runtime-clients-list" class="client-guides" aria-label="MCP clients">
    <article class="panel" data-runtime-client="codex" aria-labelledby="runtime-client-codex-heading">
      <h3 id="runtime-client-codex-heading" tabindex="-1">Codex CLI</h3>
      <p class="status" data-client-field="availability" role="status" aria-live="polite"></p>
      <dl class="client-status-list">
        <dt data-runtime-clients-copy="registration"></dt><dd data-client-field="registration"></dd>
        <dt data-runtime-clients-copy="connection"></dt><dd data-client-field="connection"></dd>
        <dt data-runtime-clients-copy="toolCall"></dt><dd data-client-field="toolCall"></dd>
        <dt data-runtime-clients-copy="backup"></dt><dd data-client-field="backup"></dd>
        <dt data-runtime-clients-copy="evidence"></dt><dd data-client-field="evidence"></dd>
      </dl>
      <p class="hint" data-client-field="caveat"></p>
      <div class="actions">
        <button type="button" data-client-action="plan"></button>
        <button type="button" class="secondary" data-client-action="verify"></button>
      </div>
    </article>
    <article class="panel" data-runtime-client="claude" aria-labelledby="runtime-client-claude-heading">
      <h3 id="runtime-client-claude-heading" tabindex="-1">Claude Code CLI</h3>
      <p class="status" data-client-field="availability" role="status" aria-live="polite"></p>
      <dl class="client-status-list">
        <dt data-runtime-clients-copy="registration"></dt><dd data-client-field="registration"></dd>
        <dt data-runtime-clients-copy="connection"></dt><dd data-client-field="connection"></dd>
        <dt data-runtime-clients-copy="toolCall"></dt><dd data-client-field="toolCall"></dd>
        <dt data-runtime-clients-copy="backup"></dt><dd data-client-field="backup"></dd>
        <dt data-runtime-clients-copy="evidence"></dt><dd data-client-field="evidence"></dd>
      </dl>
      <p class="hint" data-client-field="caveat"></p>
      <div class="actions">
        <button type="button" data-client-action="plan"></button>
        <button type="button" class="secondary" data-client-action="verify"></button>
      </div>
    </article>
    <article class="panel" data-runtime-client="gemini" aria-labelledby="runtime-client-gemini-heading">
      <h3 id="runtime-client-gemini-heading" tabindex="-1">Gemini CLI</h3>
      <p class="status" data-client-field="availability" role="status" aria-live="polite"></p>
      <dl class="client-status-list">
        <dt data-runtime-clients-copy="registration"></dt><dd data-client-field="registration"></dd>
        <dt data-runtime-clients-copy="connection"></dt><dd data-client-field="connection"></dd>
        <dt data-runtime-clients-copy="toolCall"></dt><dd data-client-field="toolCall"></dd>
        <dt data-runtime-clients-copy="backup"></dt><dd data-client-field="backup"></dd>
        <dt data-runtime-clients-copy="evidence"></dt><dd data-client-field="evidence"></dd>
      </dl>
      <p class="hint" data-client-field="caveat"></p>
      <div class="actions">
        <button type="button" data-client-action="plan"></button>
        <button type="button" class="secondary" data-client-action="verify"></button>
      </div>
    </article>
  </div>
  <section id="runtime-clients-review" class="panel" style="margin-top:12px" hidden aria-labelledby="runtime-clients-review-heading" aria-live="polite">
    <h3 id="runtime-clients-review-heading" tabindex="-1"></h3>
    <p id="runtime-clients-review-entry"></p>
    <p id="runtime-clients-review-scope"></p>
    <p id="runtime-clients-review-revision"></p>
    <ul id="runtime-clients-review-changes"></ul>
    <p id="runtime-clients-review-status" class="status" role="status" aria-live="polite"></p>
    <div class="actions">
      <button id="runtime-clients-backup" class="secondary" type="button"></button>
      <button id="runtime-clients-apply" type="button" aria-disabled="true"></button>
      <button id="runtime-clients-restore" class="secondary" type="button" hidden></button>
    </div>
  </section>
  <noscript><p class="notice" role="status">Enable JavaScript to inspect local client registration status.</p></noscript>
</section>

    renderRuntime();
    for (const [id, status] of clientStatuses) renderClient(id, status);
    renderActionNotice();
    renderReview();

    if (!value || typeof value !== 'object' || !clientIDs.has(value.client_id)) return null;

    const toolCall = value.tool_call === 'unverified' ? 'unverified' : 'unknown';

  }

      root.setAttribute('aria-busy', 'true');

    root.querySelectorAll('button').forEach(button => button.removeAttribute('aria-disabled'));
